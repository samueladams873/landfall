name: penguinport
arch: amd64
platform: linux
version: ${LANDFALL_VERSION}
section: utils
priority: optional
maintainer: Landfall project <voidwhereprohibited@users.noreply.github.com>
description: |
  Landfall Moving Wizard. Unpacks the bundle you made on Windows: puts your
  files in the right folders and installs the Linux versions of your apps.
vendor: Landfall
homepage: https://github.com/voidwhereprohibited/penguinport
license: GPL-3.0-or-later
overrides:
  deb:
    depends:
      - libxcb-cursor0
      - libegl1
      - libxkbcommon-x11-0
      - libfontconfig1
      - libfreetype6
    recommends:
      - flatpak
  rpm:
    depends:
      - xcb-util-cursor
      - libxkbcommon-x11
      - fontconfig
      - freetype
    recommends:
      - flatpak
contents:
  - src: ./build/linux/penguinport/
    dst: /opt/penguinport/
    type: tree
  - src: /opt/penguinport/penguinport
    dst: /usr/bin/penguinport
    type: symlink
  - src: ./packaging/linux/penguinport.desktop
    dst: /usr/share/applications/penguinport.desktop
  - src: ./src/landfall/data/penguinport.png
    dst: /usr/share/icons/hicolor/512x512/apps/penguinport.png
