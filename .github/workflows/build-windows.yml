name: Build Windows exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build exe
        run: pyinstaller --onefile --windowed --name Landfall --paths src --add-data "src/landfall/data:landfall/data" run_landfall.py
      - uses: actions/upload-artifact@v5
        with:
          name: Landfall-windows
          path: dist/Landfall.exe
